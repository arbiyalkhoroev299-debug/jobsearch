<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARKET.ING — Авторизация</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 8px;
      color: #1a1a1a;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .role-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .role-option {
      flex: 1;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .role-option input {
      display: none;
    }

    .role-option:has(input:checked) {
      border-color: #0088cc;
      background-color: #e6f4ff;
      color: #0088cc;
    }

    .btn-telegram {
      width: 100%;
      background-color: #0088cc;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s ease;
    }

    .btn-telegram:hover {
      background-color: #0077b5;
    }

    #authStatus {
      margin-top: 16px;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .user-info {
      background: #e6f4ff;
      padding: 15px;
      border-radius: 10px;
      margin-top: 15px;
      text-align: left;
    }

    .btn-logout {
      margin-top: 15px;
      width: 100%;
      background: #ff4d4f;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card" id="authCard">
    <h2>Вход в MARKET.ING</h2>
    <p class="subtitle">Быстрая авторизация через Telegram</p>

    <div class="role-selector">
      <label class="role-option">
        <input type="radio" name="userRole" value="Заказчик" checked>
        Заказчик
      </label>
      <label class="role-option">
        <input type="radio" name="userRole" value="Исполнитель">
        Исполнитель
      </label>
    </div>

    <button class="btn-telegram" onclick="startTelegramAuth()">
      <span>Войти через Telegram</span>
    </button>

    <div id="authStatus"></div>
  </div>

  <script>
    // ⚠️ Настройки бэкенда и бота
    const BACKEND_URL = 'http://localhost:3000';
    const BOT_USERNAME = 'caucasusjob_bot'; // Юзернейм бота без символа @

    let checkInterval = null;

    // Проверка сохраненной сессии при загрузке страницы
    window.onload = () => {
      const savedUser = localStorage.getItem('marketing_user');
      if (savedUser) {
        showLoggedInUser(JSON.parse(savedUser));
      }
    };

    async function startTelegramAuth() {
      // Генерируем уникальный код сессии
      const sessionCode = 'sess_' + Math.random().toString(36).substring(2, 10);
      const statusDiv = document.getElementById('authStatus');

      statusDiv.style.display = 'block';
      statusDiv.style.backgroundColor = '#f0f0f0';
      statusDiv.style.color = '#333';
      statusDiv.innerHTML = '⏳ Создание сессии на сервере...';

      try {
        // 1. Отправляем запрос на бэкенд для создания сессии
        const response = await fetch(`${BACKEND_URL}/api/create-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionCode })
        });

        if (!response.ok) {
          throw new Error(`Сервер вернул статус: ${response.status}`);
        }

        statusDiv.innerHTML = '✅ Сессия создана! Открываем Telegram...';

        // 2. Формируем прямую ссылку с параметром start
        const telegramUrl = `https://t.me/${BOT_USERNAME}?start=${sessionCode}`;
        window.open(telegramUrl, '_blank');

        // 3. Запускаем периодический опрос сервера каждые 2 секунды
        if (checkInterval) clearInterval(checkInterval);

        checkInterval = setInterval(async () => {
          try {
            const res = await fetch(`${BACKEND_URL}/api/check-auth/${sessionCode}`);
            const data = await res.json();

            if (data.verified) {
              clearInterval(checkInterval);

              const role = document.querySelector('input[name="userRole"]:checked').value;
              const userObj = {
                name: data.name,
                phone: data.phone,
                role: role
              };

              statusDiv.style.backgroundColor = '#d4edda';
              statusDiv.style.color = '#155724';
              statusDiv.innerHTML = '🎉 Успешная авторизация!';

              // Сохраняем пользователя в локальное хранилище
              localStorage.setItem('marketing_user', JSON.stringify(userObj));

              setTimeout(() => {
                showLoggedInUser(userObj);
              }, 800);
            }
          } catch (pollErr) {
            console.error('Ошибка при опросе бэкенда:', pollErr);
          }
        }, 2000);

      } catch (err) {
        console.error('Ошибка при отправке запроса:', err);
        statusDiv.style.backgroundColor = '#f8d7da';
        statusDiv.style.color = '#721c24';
        statusDiv.innerHTML = `❌ Не удалось связаться с сервером!<br><small>Убедитесь, что <b>node server.js</b> запущен.</small>`;
      }
    }

    // Отображение профиля авторизованного пользователя
    function showLoggedInUser(user) {
      const card = document.getElementById('authCard');
      card.innerHTML = `
        <h2>Добро пожаловать!</h2>
        <div class="user-info">
          <p><strong>Имя:</strong> ${user.name}</p>
          <p><strong>Телефон:</strong> ${user.phone}</p>
          <p><strong>Роль:</strong> ${user.role}</p>
        </div>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      `;
    }

    // Выход из профиля
    function logout() {
      localStorage.removeItem('marketing_user');
      location.reload();
    }
  </script>
</body>
</html>
